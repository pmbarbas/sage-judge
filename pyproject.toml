[build-system]
requires = []
build-backend = "sage_build_backend"
backend-path = ["."]

[project]
name = "sage-judge"
version = "0.1.0"
description = "Evidence-grounded adjudication and verifiable formal reasoning for AI systems."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]

[project.scripts]
sage-judge = "sage_judge.cli:main"
